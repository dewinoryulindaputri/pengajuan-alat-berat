<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIJALAK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; width: 100%; max-width: 450px; background: white; }
        .login-header { background-color: #0d4a2b; color: white; padding: 25px; text-align: center; }
        .btn-success-custom { background-color: #0d4a2b; border-color: #0d4a2b; color: white; }
        .btn-success-custom:hover { background-color: #145c35; border-color: #145c35; color: white; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-truck-flatbed fs-2 mb-2"></i>
            <h5 class="fw-bold mb-0">SIJALAK</h5>
            <small style="color: #a3e4d7;">Silakan login untuk melanjutkan</small>
        </div>
        
        <div class="p-4">
            <!-- Form wajib mengarah ke /login dengan method POST -->
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Masukkan username" required autocomplete="off">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success-custom w-100 py-2 fw-bold mt-3">Masuk</button>
            </form>
        </div>
    </div>

</body>
</html>
