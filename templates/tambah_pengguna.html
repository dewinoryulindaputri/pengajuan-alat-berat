<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pengguna - Admin Perizinan Alat Berat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body, html {
            height: 100%;
            background-color: #f8f9fa;
            margin: 0;
        }
        .wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background-color: #0d4a2b;
            color: white;
            flex-shrink: 0;
            padding: 20px;
        }
        .sidebar .nav-link {
            color: #b0d8c2;
            margin-bottom: 4px;
            border-radius: 5px;
            font-size: 14px;
            text-decoration: none;
            display: block;
            padding: 10px 14px;
        }
        .sidebar .nav-link:hover {
            background-color: #145c35;
            color: white;
        }
        .main-content {
            flex-grow: 1;
            padding: 30px;
            background-color: #f8f9fa;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- SIDEBAR NAVIGASI -->
        <div class="sidebar d-flex flex-column justify-content-between">
            <div>
                <div class="d-flex align-items-center mb-4 px-2 pt-2">
                    <i class="bi bi-shield-lock-fill fs-4 me-2 text-white"></i>
                    <div>
                        <h6 class="fw-bold mb-0 text-white">PANEL ADMIN</h6>
                        <small style="color: #a3e4d7;">PENGELOLA</small>
                    </div>
                </div>
                <ul class="nav flex-column mb-4">
                    <li class="nav-item"><a href="/pengguna-masuk" class="nav-link"><i class="bi bi-file-earmark-text me-2"></i> Permohonan Masuk</a></li>
                    <li class="nav-item"><a href="/master-sarana" class="nav-link"><i class="bi bi-truck me-2"></i> Master Sarana</a></li>
                    <li class="nav-item"><a href="/laporan" class="nav-link"><i class="bi bi-bar-chart-fill me-2"></i> Laporan</a></li>
                    <li class="nav-item"><a href="/pengguna" class="nav-link active"><i class="bi bi-people-fill me-2"></i> Pengguna</a></li>
                </ul>
            </div>
            <div>
                <hr class="text-secondary my-3">
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="/logout" class="nav-link text-danger"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                </ul>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-4 rounded-4 shadow-sm">
                <div>
                    <h4 class="fw-bold mb-1 text-dark">Tambah Pengguna Baru</h4>
                    <p class="text-muted small mb-0">Formulir pendaftaran akun pengguna sistem.</p>
                </div>
                <a href="/pengguna" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Kembali</a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="max-width: 600px;">
                <form action="/pengguna/tambah" method="POST">
                    <div class="mb-3">
                        <label for="nama" class="form-label small fw-bold">Nama Lengkap</label>
                        <input type="text" class="form-control" id="nama" name="nama" required placeholder="Masukkan nama lengkap">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-bold">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="nama@perizinan.com">
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label small fw-bold">Role / Hak Akses</label>
                        <select class="form-select" id="role" name="role">
                            <option value="Administrator">Administrator</option>
                            <option value="Petugas">Petugas</option>
                            <option value="User / Pemohon" selected>User / Pemohon</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="/pengguna" class="btn btn-light btn-sm px-3">Batal</a>
                        <button type="submit" class="btn btn-success btn-sm px-4 fw-bold">Simpan Pengguna</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
