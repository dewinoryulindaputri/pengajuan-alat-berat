<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Instalasi - Admin Perizinan Alat Berat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { width: 260px; background-color: #0d4a2b; min-height: 100vh; position: fixed; top: 0; left: 0; color: white; z-index: 9999 !important; overflow-y: auto; }
        .sidebar .nav-link { color: #b0d8c2; margin-bottom: 3px; border-radius: 5px; font-size: 14px; text-decoration: none; display: block; }
        .sidebar .nav-link:hover { background-color: #145c35; color: white; }
        .sidebar .nav-link.active-page { background-color: #145c35; color: white; font-weight: bold; }
        .main-content { margin-left: 260px; padding: 30px; position: relative; z-index: 1; }
    </style>
</head>
<body>

    <div class="sidebar p-3 d-flex flex-column justify-content-between">
        <div>
            <div class="d-flex align-items-center mb-4 px-2 pt-2">
                <i class="bi bi-shield-lock-fill fs-4 me-2 text-white"></i>
                <div>
                    <h6 class="fw-bold mb-0 text-white">PANEL ADMIN</h6>
                    <small style="color: #a3e4d7;">PENGELOLA</small>
                </div>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/admin" class="nav-link py-2 px-3 mb-1"><i class="bi bi-grid-fill me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/permohonan-masuk" class="nav-link py-2 px-3 mb-1"><i class="bi bi-file-earmark-text me-2"></i> Permohonan Masuk</a></li>
                <li class="nav-item"><a href="/master-sarana" class="nav-link py-2 px-3 mb-1"><i class="bi bi-truck me-2"></i> Master Sarana</a></li>
                <li class="nav-item"><a href="/master-prasarana" class="nav-link py-2 px-3 mb-1"><i class="bi bi-buildings me-2"></i> Master Prasarana</a></li>
                <li class="nav-item"><a href="/master-instalasi" class="nav-link active-page py-2 px-3 mb-1"><i class="bi bi-gear me-2"></i> Master Instalasi</a></li>
                <li class="nav-item"><a href="/master-peralatan" class="nav-link py-2 px-3 mb-1"><i class="bi bi-tools me-2"></i> Master Peralatan</a></li>
            </ul>
        </div>
        <div>
            <hr class="text-secondary">
            <a href="/logout" class="nav-link text-danger py-2 px-3"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-4 rounded-4 shadow-sm">
            <div>
                <h4 class="fw-bold mb-1 text-dark">Edit Data Instalasi</h4>
                <p class="text-muted small mb-0">Perbarui informasi instalasi.</p>
            </div>
            <a href="/master-instalasi" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Kembali</a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="max-width: 700px;">
            <form method="POST" action="/master-instalasi/edit/{{ item.id }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">Jenis Instalasi</label>
                    <input type="text" name="jenis_instalasi" class="form-control" value="{{ item.jenis_instalasi }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Kapasitas</label>
                    <input type="text" name="kapasitas" class="form-control" value="{{ item.kapasitas }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Status</label>
                    <select name="status" class="form-select">
                        <option value="Beroperasi" {% if item.status == 'Beroperasi' %}selected{% endif %}>Beroperasi</option>
                        <option value="Tidak Beroperasi" {% if item.status == 'Tidak Beroperasi' %}selected{% endif %}>Tidak Beroperasi</option>
                        <option value="Perbaikan" {% if item.status == 'Perbaikan' %}selected{% endif %}>Perbaikan</option>
                    </select>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <a href="/master-instalasi" class="btn btn-outline-secondary">Batal</a>
                    <button type="submit" class="btn btn-success fw-bold">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
