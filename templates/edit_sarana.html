<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Sarana - Admin Perizinan Alat Berat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .main-container { max-width: 600px; margin: 50px auto; }
    </style>
</head>
<body>

    <div class="container main-container">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <h4 class="fw-bold mb-3 text-dark"><i class="bi bi-pencil-square text-warning me-2"></i>Edit Data Sarana</h4>
            <form action="/edit-sarana/{{ sarana.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Jenis Sarana</label>
                    <input type="text" class="form-control" name="jenis_sarana" value="{{ sarana.jenis_sarana }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">No. Lambung</label>
                    <input type="text" class="form-control" name="no_lambung" value="{{ sarana.no_lambung }}" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small">Merk</label>
                        <input type="text" class="form-control" name="merk" value="{{ sarana.merk }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small">Tipe</label>
                        <input type="text" class="form-control" name="tipe" value="{{ sarana.tipe }}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Instansi</label>
                    <input type="text" class="form-control" name="instansi" value="{{ sarana.instansi }}" required>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="/master-sarana" class="btn btn-secondary px-4">Batal</a>
                    <button type="submit" class="btn btn-success px-4">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
