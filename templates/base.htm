<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Perizinan - SIJALAK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .sidebar { width: 260px; background-color: #0d4a2b; height: 100vh; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 1000; transition: width 0.3s; }
        .nav-link { color: #b0d8c2; padding: 12px 20px; display: flex; align-items: center; white-space: nowrap; }
        .nav-link:hover { background-color: #145c35; color: white; }
        .main-content { margin-left: 260px; padding: 30px; transition: margin-left 0.3s; }

        /* Media Query untuk HP / Layar di bawah 768px */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px !important;
                padding: 10px !important;
            }
            .main-content {
                margin-left: 70px !important;
                padding: 15px !important;
            }
            .sidebar h5,
            .sidebar .nav-link span {
                display: none !important;
            }
            .sidebar .nav-link {
                justify-content: center !important;
                padding: 12px 0px !important;
            }
            .sidebar .nav-link i {
                font-size: 1.4rem !important;
                margin-right: 0 !important;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <h5 class="text-white mb-4">SIJALAK</h5>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="/admin" class="nav-link"><i class="bi bi-grid me-2"></i> <span>Dashboard</span></a>
            </li>
            <li class="nav-item">
                <a href="/permohonan-masuk" class="nav-link"><i class="bi bi-file-text me-2"></i> <span>Permohonan Masuk</span></a>
            </li>
            <li class="nav-item">
                <a href="/pengaturan" class="nav-link"><i class="bi bi-sliders me-2"></i> <span>Pengaturan</span></a>
            </li>
        </ul>
        <a href="/logout" class="nav-link text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> <span>Logout</span></a>
    </div>

    <!-- Area Konten -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
