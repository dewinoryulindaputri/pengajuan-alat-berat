<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Perizinan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .sidebar { width: 260px; background-color: #0d4a2b; height: 100vh; position: fixed; left: 0; top: 0; }
        .nav-link { color: #b0d8c2; padding: 12px 20px; }
        .nav-link:hover { background-color: #145c35; color: white; }
        .main-content { margin-left: 260px; padding: 30px; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <h5 class="text-white mb-4">PANEL ADMIN</h5>
        <ul class="nav flex-column">
            <li class="nav-item"><a href="/admin" class="nav-link"><i class="bi bi-grid"></i> Dashboard</a></li>
            <li class="nav-item"><a href="/permohonan-masuk" class="nav-link"><i class="bi bi-file-text"></i> Permohonan Masuk</a></li>
            <li class="nav-item"><a href="/pengaturan" class="nav-link"><i class="bi bi-sliders"></i> Pengaturan</a></li>
            <!-- Tambahkan menu lainnya di sini -->
        </ul>
        <a href="/logout" class="nav-link text-danger mt-5"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- Area Konten yang akan berubah-ubah -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
